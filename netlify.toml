[build]
  command = "node inject-env.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le lien envoyé au donneur d'ordre : /c/<jeton> → la page de confirmation.
# Page autonome et légère : il n'a pas de compte et arrive peut-être avec une
# connexion lente — inutile de lui faire charger toute l'app.
[[redirects]]
  from = "/c/*"
  to = "/confirmation.html"
  status = 200

# Le lien envoyé à la banque : /b/<jeton> → la page du dossier de financement.
[[redirects]]
  from = "/b/*"
  to = "/banque.html"
  status = 200

# Le lien de paiement au donneur : /p/<jeton> → coordonnées de cantonnement.
[[redirects]]
  from = "/p/*"
  to = "/paiement.html"
  status = 200

# Le portail personnel durable du donneur : /portail/<code> → tous ses paiements.
[[redirects]]
  from = "/portail/*"
  to = "/portail.html"
  status = 200

# Le portail permanent de la banque partenaire : /banque-portail/<code>.
[[redirects]]
  from = "/banque-portail/*"
  to = "/banque-portail.html"
  status = 200

# Confirmation de décaissement par la banque : /d/<jeton>.
[[redirects]]
  from = "/d/*"
  to = "/decaissement.html"
  status = 200

# Confirmation de remboursement par la banque : /r/<jeton>.
[[redirects]]
  from = "/r/*"
  to = "/remboursement.html"
  status = 200
[[redirects]]
  from = "/cession/*"
  to = "/cession.html"
  status = 200
[[redirects]]
  from = "/facture/*"
  to = "/facture.html"
  status = 200
[[redirects]]
  from = "/rachat/*"
  to = "/rachat.html"
  status = 200
# La quittance du financeur : /q/<jeton> → confirmation de réception.
# La banque et le donneur confirment déjà ; le financeur n'avait rien,
# alors qu'il a avancé les fonds.
[[redirects]]
  from = "/q/*"
  to = "/quittance.html"
  status = 200
# La page de présentation : /a-propos → qui nous sommes, et la FAQ.
[[redirects]]
  from = "/a-propos"
  to = "/apropos.html"
  status = 200
